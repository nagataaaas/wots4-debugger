; debugger settings. Each feature has a [<feature name>] section; enabled=1 turns it on, 0 turns it off.

[error_log]
; Log exceptions to logs\error_<date-time>_<process ID>.log in the game folder
enabled=1
; Detail level of the minidump written when the game crashes (logs\crash_<date-time>_<process ID>.dmp)
;   off      : do not write one
;   small    : stacks and registers of all threads, and the module list (a few hundred KB)
;   standard : small, plus global variables, memory that registers and stacks point to,
;              and memory allocation state (a few MB to a few tens of MB)
;   full     : all process memory (hundreds of MB to several GB)
minidump=standard

[jank]
; Find what made a frame slow (a hitch). Writes logs\jank_<date-time>_<process ID>.log in the game folder:
; for each slow frame, which part of the main loop took the time, which game calls were running,
; and which code the main thread was executing. Also a frame time summary (FPS, percentiles) now and then.
; It stops the game's main thread for a few microseconds every sample, so leave it off while just playing.
enabled=0
; A frame counts as slow when it takes at least this many milliseconds.
; 0 = automatic: 1.5 times the median of recent frames (at least the median + 5 ms)
threshold_ms=0
; Interval between samples of the main thread, in microseconds (250 to 10000)
sample_interval_us=1000
; Slow frames written in detail per minute at most (0 to 600). Further ones in that minute are only counted
max_reports_per_minute=20
; Write a frame time summary every this many seconds (0 = never, up to 3600)
summary_seconds=60

[voice_trace]
; Find why a character voice does not play. Writes logs\voice_<date-time>_<process ID>.log in the game folder:
; one line for each voice a script plays (PlayVoiceSE, such as shopkeepers and talk), and one for each voice from
; game code (battle cries and such) that did not play, with the check that refused it.
enabled=0
; 1 = also write voices from game code that played
log_played_game_voices=0
; Lines about voices from game code per minute at most (0 to 6000). Script voices are always written
max_lines_per_minute=120
