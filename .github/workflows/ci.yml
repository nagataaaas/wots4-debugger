name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Version of the ModLoader (Mod SDK) to build against. A wots4-mods tag or commit
  WOTS4_SDK_REF: 3c00fc96cc472e3b3ca3f03a3cdcb5d3253d564c  # ModLoader version to use. Once a ModLoader release is out, set it to that tag (e.g. v0.1.0)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - uses: actions/checkout@v4
        with:
          repository: nagataaaas/wots4-mods
          ref: ${{ env.WOTS4_SDK_REF }}
          path: sdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for the tests
        run: python -m pip install cryptography

      - name: build and test
        run: |
          cmake -S mod -B build -A Win32 -DWOTS4_SDK_DIR="${{ github.workspace }}/sdk"
          cmake --build build --config Release
          ctest --test-dir build -C Release -LE needs_exe --output-on-failure --timeout 300
